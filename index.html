<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Hnefatafl — Copenhagen rules 11×11. Stage 3: playable with medium AI (human vs AI, AI vs AI)." />
  <title>Hnefatafl by Gislason — Copenhagen 11×11</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- App root: board, buttons, status, HEN filled by JS -->
  <div id="app"></div>

  <!-- Classic scripts (no ES modules) — works on file:// and GitHub Pages -->
  <script src="model.js"></script>
  <script src="hen.js"></script>
  <script src="view.js"></script>
  <script src="ai.js"></script>
  <script src="controller.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var game = window.HnefataflModel.createGame();
      window.HnefataflController.init(game);
    });
  </script>
</body>
